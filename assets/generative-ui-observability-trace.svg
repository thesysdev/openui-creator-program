<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
  <title id="title">Generative UI render trace pipeline</title>
  <desc id="desc">A left-to-right pipeline showing request context, tool context, UI proposal, parse and validation, render decision, and user action trail, all feeding an append-only trace store used for replay.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#101827"/><stop offset="100%" stop-color="#172554"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity="0.35"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/></marker>
  </defs>
  <rect width="1280" height="620" rx="36" fill="url(#bg)"/>
  <g opacity="0.22" fill="none" stroke="#60a5fa" stroke-width="1">
    <path d="M80 96 C230 26 390 190 530 96 S850 92 1020 138 1170 64 1220 96"/>
    <path d="M70 520 C210 440 400 570 560 500 S820 430 990 500 1140 470 1210 520"/>
  </g>
  <text x="70" y="74" fill="#e0f2fe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">Render decisions should leave a replayable trace</text>
  <text x="70" y="112" fill="#bae6fd" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">Capture the boundaries where generated UI becomes application UI, not just the chat transcript.</text>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" filter="url(#shadow)">
    <g transform="translate(70 175)"><rect width="160" height="128" rx="20" fill="url(#card)" stroke="#38bdf8"/><text x="22" y="38" fill="#f8fafc" font-size="18" font-weight="700">Request</text><text x="22" y="64" fill="#cbd5e1" font-size="13">route, tenant</text><text x="22" y="85" fill="#cbd5e1" font-size="13">role, flags</text><text x="22" y="106" fill="#cbd5e1" font-size="13">prompt version</text></g>
    <g transform="translate(270 175)"><rect width="160" height="128" rx="20" fill="url(#card)" stroke="#38bdf8"/><text x="22" y="38" fill="#f8fafc" font-size="18" font-weight="700">Tool context</text><text x="22" y="64" fill="#cbd5e1" font-size="13">tool result IDs</text><text x="22" y="85" fill="#cbd5e1" font-size="13">freshness</text><text x="22" y="106" fill="#cbd5e1" font-size="13">redactions</text></g>
    <g transform="translate(470 175)"><rect width="160" height="128" rx="20" fill="url(#card)" stroke="#38bdf8"/><text x="22" y="38" fill="#f8fafc" font-size="18" font-weight="700">UI proposal</text><text x="22" y="64" fill="#cbd5e1" font-size="13">OpenUI Lang</text><text x="22" y="85" fill="#cbd5e1" font-size="13">stream chunks</text><text x="22" y="106" fill="#cbd5e1" font-size="13">component tree</text></g>
    <g transform="translate(670 175)"><rect width="160" height="128" rx="20" fill="url(#card)" stroke="#38bdf8"/><text x="22" y="38" fill="#f8fafc" font-size="18" font-weight="700">Parse + guard</text><text x="22" y="64" fill="#cbd5e1" font-size="13">schema checks</text><text x="22" y="85" fill="#cbd5e1" font-size="13">permissions</text><text x="22" y="106" fill="#cbd5e1" font-size="13">fallbacks</text></g>
    <g transform="translate(870 175)"><rect width="160" height="128" rx="20" fill="url(#card)" stroke="#38bdf8"/><text x="22" y="38" fill="#f8fafc" font-size="18" font-weight="700">Render</text><text x="22" y="64" fill="#cbd5e1" font-size="13">accepted</text><text x="22" y="85" fill="#cbd5e1" font-size="13">partial</text><text x="22" y="106" fill="#cbd5e1" font-size="13">downgraded</text></g>
    <g transform="translate(1070 175)"><rect width="160" height="128" rx="20" fill="url(#card)" stroke="#38bdf8"/><text x="22" y="38" fill="#f8fafc" font-size="18" font-weight="700">Action trail</text><text x="22" y="64" fill="#cbd5e1" font-size="13">shown/disabled</text><text x="22" y="85" fill="#cbd5e1" font-size="13">confirmed</text><text x="22" y="106" fill="#cbd5e1" font-size="13">executed</text></g>
  </g>
  <g stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)" fill="none"><path d="M235 239 H262"/><path d="M435 239 H462"/><path d="M635 239 H662"/><path d="M835 239 H862"/><path d="M1035 239 H1062"/></g>
  <g font-family="Inter, Segoe UI, Arial, sans-serif"><rect x="240" y="390" width="800" height="112" rx="24" fill="#082f49" stroke="#0ea5e9"/><text x="280" y="430" fill="#f0f9ff" font-size="21" font-weight="700">Append-only render trace store</text><text x="280" y="462" fill="#bae6fd" font-size="15">traceId, messageId, registry version, schema version, proposal, parse result, guard decision, fallback, action outcome</text><text x="280" y="489" fill="#7dd3fc" font-size="14">Used later for support debugging, incident review, deterministic replay, and renderer upgrade tests.</text></g>
  <g stroke="#7dd3fc" stroke-width="2" stroke-dasharray="6 8" fill="none"><path d="M150 308 C180 372 260 383 330 390"/><path d="M350 308 C390 360 420 377 500 390"/><path d="M550 308 C580 350 610 378 640 390"/><path d="M750 308 C735 350 720 370 700 390"/><path d="M950 308 C925 355 890 378 820 390"/><path d="M1150 308 C1100 372 1020 385 950 390"/></g>
</svg>
